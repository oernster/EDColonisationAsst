journal:
  # No directory here on purpose. This file is tracked, so a path written into
  # it is one machine's path shipped to everybody, and the one that used to be
  # here pointed at a Linux Steam Proton prefix. Left unset, the journal
  # directory is detected from the Saved Games folder instead. Set it only to
  # override that.
  watch_interval: 1.0
logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
server:
  cors_origins:
  - http://localhost:5173
  - https://oernster.github.io
  host: 0.0.0.0
  port: 47021
websocket:
  ping_interval: 30
  reconnect_attempts: 5
