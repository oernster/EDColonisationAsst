[project]
name = "ed-colonisation-assistant-backend"
# The canonical version lives in the top-level VERSION file; nothing else
# hardcodes a version (see backend/src/__init__.py for the runtime read).
dynamic = ["version"]
description = "Backend for Elite: Dangerous Colonisation Assistant"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.dynamic]
version = { file = ["../VERSION"] }

[tool.black]
line-length = 88
target-version = ["py311"]
# Both trees, not just src/. This read "src/.*" alone, so every file under
# backend/tests/ was silently skipped: black reported "no Python files are
# present" against a directory of 37 of them. The pre-commit hook's format step
# was a no-op for any staged test file as a result.
include = "(src|tests)/.*\\.pyi?$"
exclude = """
/(
    \\.git
  | \\.venv
  | \\.mypy_cache
  | \\.pytest_cache
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
src_paths = ["src"]
skip = [".venv", "build", "dist", ".mypy_cache", ".pytest_cache"]
combine_as_imports = true
force_sort_within_sections = true
order_by_type = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"

[tool.coverage.run]
branch = true
# `source` is deliberately NOT set here. This file is the single coverage
# configuration for the project and is read from two working directories:
# backend/ (which passes --cov=src) and the repository root (which passes
# --cov=backend/src and points at this file with --cov-config). A single
# `source` value cannot be correct from both, so each pytest.ini supplies its
# own path and everything else is shared.
#
# The coverage gate is scoped to the testable backend surface. The Qt
# runtime shell (tray, splash, launcher, single-instance lock, in-process
# uvicorn orchestration) and the thin entrypoints are excluded: they are
# either fragile PySide6 UI surfaces or process-level composition roots.
# Their pure logic (readiness monitor, menu wiring, process groups) is
# extracted into testable form and covered via the unit tests.
#
# The patterns are prefix-agnostic so they match whether the run was started
# from backend/ or from the root. Without that, a root-level run silently
# measured eleven extra files and reported 84% against the same suite.
omit = [
    # The setup program's Qt client. installer/ops, installer/state and
    # installer/shared are inside the gate: they do the most privileged work in
    # the product (registry writes, shortcut creation, per-user deployment,
    # uninstall) and are Qt-free, so they are unit tested rather than left
    # unmeasured. The window, its dialogs and the composition root are excluded
    # on the same grounds as the backend's runtime shell.
    "**/installer/ui/*",
    "**/installer/app.py",
    "**/src/main.py",
    "**/src/launcher.py",
    "**/src/tray_app.py",
    "**/src/runtime_entry.py",
    "**/src/runtime/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

# The linter settings live under [tool.ruff.lint]. They were written as
# top-level keys, which current ruff accepts only with a deprecation warning, so
# the first real run of this configuration started by complaining about itself.
[tool.ruff.lint]
extend-select = [
  "E",
  "F",
  "W",
  "I",  # isort-compatible import ordering; "I" enables it, it is not a stub
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
combine-as-imports = true
