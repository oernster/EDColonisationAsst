[pytest]
# Repo-root pytest configuration.
#
# This exists so running `pytest` from the project root (common in VS Code / CI)
# uses a writable cache directory and the backend test suite by default.
testpaths = backend/tests tests
# The repository root on the module search path, so the installer suite can
# import installer.* however pytest was invoked. The root tests/ directory is
# deliberately not a package: backend/tests already claims the top-level name
# "tests", so a second one would shadow it.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# These MUST mirror backend/pytest.ini. Without them a root-level run enforced
# no coverage gate and, lacking asyncio_mode, silently skipped every async test:
# 276 passed and 54 skipped, against 330 passed from backend/. The weaker of the
# two configurations was the one the likelier invocation picked up.
#
# The installer suite runs from the root only: it needs the repository root on
# the module search path to import installer.*, and the backend configuration
# is scoped to backend/. Its Qt-free packages are inside the same 100% gate;
# installer/ui and installer/app.py are omitted in backend/pyproject.toml.
addopts =
    -v
    --cov=backend/src
    --cov=installer
    --cov-config=backend/pyproject.toml
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=100
asyncio_mode = auto

# Store pytest cache under backend/ to avoid permission issues writing
# <repo>/.pytest_cache on some Windows setups.
cache_dir = backend/.pytest_cache
